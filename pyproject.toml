[project]
name = "fg-actuarial-science-discord-bot"
version = "1.0.0"
description = "Discord bot for the FG Actuarial Science server: music, chess against ShessGPT and daily actuarial job reports."
readme = "README.md"
license = "MIT"
authors = [{ name = "Julian Schopp" }]
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.7",        # Discord API, slash commands, voice (incl. DAVE E2EE)
    "pydantic-settings>=2.4",        # typed configuration from .env / environment
    # Music
    "yt-dlp[default]>=2025.10.22",   # YouTube & co. audio extraction (needs deno for YouTube)
    "spotipy>=2.24",                 # resolve Spotify links to "artist - title"
    # Chess
    "chess>=1.11",                   # board logic, SVG rendering, async UCI engine (Stockfish)
    "cairosvg>=2.7",                 # SVG board -> PNG
    "torch>=2.5",                    # ShessGPT neural network (CPU wheels, see [tool.uv.sources])
    "numpy>=2.0",                    # fast bitboard unpacking for the ShessGPT input encoding
    # Job reports
    "swiss-actuarial-job-scraper",   # the `actjobs` package (path dependency, see below)
]

[project.scripts]
fgbot = "fgbot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fgbot"]

# ---------------------------------------------------------------------------------- uv
[tool.uv.sources]
# The job scraper lives next to this repository (see docs/deployment.md).
swiss-actuarial-job-scraper = { path = "../swiss-actuarial-job-scraper", editable = true }
# CPU-only PyTorch: ~200 MB instead of several GB of CUDA libraries.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# -------------------------------------------------------------------------------- tools
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"] # verbatim copy of the old code, used as a test oracle

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002"] # allow typographic characters like "–" and "·" in text

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
